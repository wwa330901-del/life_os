name: Android smoke test

# 手動執行：在雲端的 Android 平板模擬器裝上 APK、打開，截圖＋存 logcat，
# 確認 App 開得起來、不會閃退。本機沒有 Android SDK，平板版改動後用這個驗證。
# google=true 時再按「使用 Google 登入」，每隔幾秒截一張，看登入流程卡在哪。
# update=true 時用舊版本號打包，按「現在更新」看 App 內下載＋系統安裝畫面
# （最後一步會因為模擬器版是 debug 簽章而裝不上，只看安裝畫面有跳出）。
on:
  workflow_dispatch:
    inputs:
      google:
        description: "也按 Google 登入"
        type: boolean
        default: false
      update:
        description: "測 App 內更新"
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/windows_app
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      # 版本號設很大，免得一打開就跳「有新版本」擋住畫面；測更新時反過來設很舊。
      - run: flutter build apk --release --target-platform android-x64 --build-name=${{ inputs.update && '2.0.0' || '99.0.0' }} --build-number=1

      - name: Write emulator script
        run: |
          mkdir -p smoke
          cat > smoke/run.sh <<'SH'
          set -x
          adb install -r build/app/outputs/flutter-apk/app-release.apk
          adb logcat -c
          adb shell am start -n com.yuanxu.life_os_app/.MainActivity
          sleep 30
          adb exec-out screencap -p > smoke/landscape.png
          adb shell pidof com.yuanxu.life_os_app > smoke/pid.txt || echo "NOT RUNNING" > smoke/pid.txt
          if [ "$UPDATE" = "true" ]; then
            # 「現在更新」按鈕在橫向 2560x1600 畫面的位置
            adb shell input tap 1595 925
            sleep 5
            adb exec-out screencap -p > smoke/update_1_downloading.png
            sleep 100
            adb exec-out screencap -p > smoke/update_2_permission.png
            # 等於在設定頁打開「允許來自這個來源」再按返回
            adb shell appops set com.yuanxu.life_os_app REQUEST_INSTALL_PACKAGES allow
            adb shell input keyevent KEYCODE_BACK
            sleep 6
            adb exec-out screencap -p > smoke/update_3_installer.png
          elif [ "$GOOGLE" = "true" ]; then
            # 跳過 Chrome 第一次開啟的歡迎畫面（會擋住 Google 登入頁）
            adb shell 'echo "_ --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml smoke/ui.xml
            # 「使用 Google 登入」按鈕在橫向 2560x1600 畫面的位置
            adb shell input tap 1280 1117
            sleep 10
            adb exec-out screencap -p > smoke/google_1_browser.png
            # 模擬 Google 把授權碼送回 App 的 127.0.0.1 小伺服器（假的碼，後端會回錯誤——
            # 重點是看 App 回到前景後連得上後端、錯誤是中文）。
            adb shell cat /proc/net/tcp /proc/net/tcp6 > smoke/tcp.txt || true
            uid=$(adb shell pm list packages -U com.yuanxu.life_os_app | grep -oE 'uid:[0-9]+' | head -1 | cut -d: -f2)
            # /proc/net/tcp 欄位：第 2 欄 本機位址:埠(16 進位；Dart 的 127.0.0.1 伺服器出現在 tcp6，寫成 ::ffff:127.0.0.1)、第 4 欄 狀態(0A=LISTEN)、第 8 欄 uid
            port_hex=$(awk -v uid="$uid" '$4=="0A" && $8==uid && $2 ~ /0100007F:/ {n=split($2,a,":"); print a[n]; exit}' smoke/tcp.txt)
            port=$((16#${port_hex:-0}))
            echo "uid=$uid port=$port" > smoke/port.txt
            adb shell am start -a android.intent.action.VIEW -d "http://127.0.0.1:$port/?code=fake-code" com.android.chrome
            sleep 8
            adb exec-out screencap -p > smoke/google_2_done_page.png
            # 等於按「回到元序」
            adb shell am start -a android.intent.action.VIEW -d "yuanxu://login"
            sleep 12
            adb exec-out screencap -p > smoke/google_3_back_in_app.png
          else
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 10
            adb exec-out screencap -p > smoke/rotated.png
          fi
          adb logcat -d > smoke/logcat.txt
          SH

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOGLE: ${{ inputs.google }}
          UPDATE: ${{ inputs.update }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 10
          disable-animations: true
          working-directory: apps/windows_app
          script: bash smoke/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: apps/windows_app/smoke
