name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
      - run: npm test -- --ci

  # 資料庫更新（migration）大多是手寫的：在全新的真 Postgres 從頭跑一遍，
  # 再比對跑完的結果跟 schema.prisma 一模一樣，才不會推上去 Render 才發現壞掉。
  database:
    name: Database (migrations on real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: life_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/life_os_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Apply every migration from scratch
        run: npx prisma migrate deploy
      - name: Migrations must match schema.prisma exactly
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  windows_app:
    name: Windows App (analyze + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
